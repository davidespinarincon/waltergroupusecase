name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests (golden cases with recorded extractions; live Claude test runs only if the secret is set)
        run: pytest -v
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: walter-price-workflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Smoke test the stack
        run: |
          docker compose up -d --build --wait
          curl -fsS -X POST localhost:8000/demo/samples | python3 -c "import json,sys; d=[r['decision'] for r in json.load(sys.stdin)]; print(d); assert d==['SEND_PRICE','IGNORE','ASK_CUSTOMER','SEND_PRICE','SEND_PRICE','HANDOVER_HUMAN','HANDOVER_HUMAN']"
          docker compose down -v
